[package]
name = "open-pdf-cmyk"
version = "2026.44.29"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Converts the RGB colour of a PDF to CMYK through an ICC printing profile (PDF/X export)"
publish = false

[dependencies]
# Zelfde lopdf-lijn als de app-crate en open-pdf-render: één versie in de lock.
lopdf = "0.34"
flate2 = "1"
# Alleen de JPEG-decoder, voor afbeeldingen met DCTDecode.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# CMYK-JPEG schrijven (libjpeg-turbo, met cmake gebouwd); zelfde crate en
# features als open-pdf-render, dus geen tweede bouw van de C-bibliotheek.
turbojpeg = { version = "1", default-features = false, features = ["cmake"] }
# Little CMS (MIT): de echte RGB→CMYK-transformatie. `static` bouwt de
# meegeleverde C-bron in de binary. Zonder die feature linkt lcms2-sys via
# pkg-config tegen de systeembibliotheek van de bouwmachine; op de macOS-runner
# was dat /opt/homebrew/.../liblcms2.2.dylib, waardoor de app bij gebruikers
# zonder Homebrew niet startte (#750, #361). Statisch op elk platform, dus ook
# geen liblcms2.so.2 meer nodig in de .deb en de AppImage.
lcms2 = { version = "6", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
