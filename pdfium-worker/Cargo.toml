[package]
name = "pdfium-worker"
version = "2026.44.8"
edition = "2021"

[[bin]]
name = "pdfium-worker"
path = "src/main.rs"

[dependencies]
pdfium-render = { version = "0.9.4", features = ["thread_safe", "image_025"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Render-only /BBox for tiny mesh shadings (#395, src/mesh_bbox.rs). Same
# lopdf line as the app crate; no rayon/chrono needed in the sidecar.
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
flate2 = "1"
memchr = "2"
