[package]
name = "open-pdf-studio"
version = "2.4.1"
description = "A free, open-source PDF annotation editor"
authors = ["OpenAEC Foundation"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenAEC-Foundation/Open-2D-Studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = ["devtools", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2"
dirs = "5"
# Windows-verbatimpaden (\\?\C:\...) terugzetten naar gewone paden voor
# C-bibliotheken die er zelf "/" achter plakken (Tesseract-taaldata).
# Staat al in Cargo.lock; geen nieuwe crate.
dunce = "1"
whoami = "1"
base64 = "0.22"
open = "5"
zip = "2"

tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# Reads a bitmap off the system clipboard for the screenshot-annotate feature
# (Windows PrtScn puts the capture on the clipboard). Cross-platform.
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }
open-pdf-render = { path = "../../open-pdf-render" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pdfium-render = { version = "0.9", features = ["thread_safe", "image_025"] }
clap = { version = "4", features = ["derive"] }

# OpenAEC Accounts ("Sign in with OpenAEC", accounts.rs): PKCE + OS-keyring
# token storage + multipart uploads to the Accounts API.
keyring = { version = "3", features = ["windows-native"] }
sha2 = { version = "0.10", features = ["oid"] }
# Digitale handtekeningen (#374): RustCrypto op de der 0.7-lijn. pkcs12 0.1,
# cms 0.2 en x509-cert 0.2 hangen daar zelf aan; niet mengen met der 0.8.
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "sha1-insecure"] }
cms = "0.2"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = "0.7"
x509-cert = "0.2"
const-oid = { version = "0.9", features = ["db"] }
hmac = "0.12"
sha1 = { version = "0.10", features = ["oid"] }
des = { version = "0.8", features = ["zeroize"] }
rc2 = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["alloc", "zeroize"] }
rsa = "0.9"
# ECDSA-verificatie (handtekeningen en certificaatketens, spec §7.1). 0.13 is de
# der 0.7-lijn; "pkcs8" levert ook Signature::from_der.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
zeroize = "1"
rand = "0.8"
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "process", "io-util", "time"] }
memmap2 = "0.9"
anyhow = "1"

# In-process MCP server for the render-regression-test harness. We hand-roll
# the JSON-RPC layer on top of axum rather than pulling in `rmcp`, because
# rmcp's macro-driven API has churned across versions and the harness only
# needs a small fixed method set (initialize / tools/list / tools/call).
axum = "0.8"

# Direct dep for MCP tool handlers that need to inspect PDF structure (page
# count, etc). Pinned to match `open-pdf-render`'s transitive version so the
# resolver picks a single lopdf in Cargo.lock.
lopdf = "0.34"
# Begrensd uitpakken van objectstromen bij het lezen van handtekeningen; zelfde
# versie als die lopdf al gebruikt.
flate2 = "1"

# OCR proof-of-concept (Traditional Chinese + English) — see js/... OCR plan.
#
# use-system-tesseract (Linux only): link against Tesseract/Leptonica already
# installed on the build machine (pkg-config) instead of compiling them from
# source. build-tesseract pulled in reqwest (default features -> native-tls
# -> openssl-sys) purely to download the source archives at build time — Linux
# CI installs libtesseract-dev/libleptonica-dev to avoid that. Local dev needs
# them too.
#
# build-tesseract (macOS/Windows): kept as source-build on both. macOS can't
# use use-system-tesseract for the universal (arm64+x86_64) build — Homebrew
# dropped support for the Rosetta x86_64-on-Apple-Silicon install pattern
# ("Homebrew on macOS is only supported on Apple Silicon processors!"), so
# there's no way to get x86_64 Tesseract/Leptonica via brew on an Apple
# Silicon runner any more. The macOS arch-mismatch link error this was meant
# to fix instead needs release.yml/ci.yml/nightly.yml to pre-build each Apple
# target as its own `cargo build` invocation with tesseract-rs's external
# build cache (~/Library/Application Support/tesseract-rs) cleared between
# them, so the stale-cache bug in its build.rs never gets a chance to bite —
# see the "Build Tauri app / Build macOS app" steps there. Windows has no
# equivalent "system-installed Tesseract" story without adding a vcpkg
# dependency, and that CI leg already builds cleanly from source.
#
# Android: no OCR. The source build of Tesseract/Leptonica does not work with
# the NDK (CMake misses CpuFeaturesNdkCompat, the link step misses
# -lleptonica), so the crate is left out entirely and `ocr_pdf_page` is a
# stub that returns an error (see src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
tesseract-rs = { version = "0.4", default-features = false, features = ["use-system-tesseract"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
tesseract-rs = { version = "0.4", default-features = false, features = ["build-tesseract"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"
# Drag-out window detach — desktop only (the crate has no mobile platform
# backend and fails to compile for Android/iOS).
tauri-plugin-drag = "2.1.1"
# Global system hotkey (PrtScn) for the opt-in screenshot-annotate feature.
# Desktop only.
tauri-plugin-global-shortcut = "2"

# Rootarchief van het besturingssysteem als DER buiten Windows (macOS-sleutelhanger,
# OpenSSL-paden op Linux). Staat al in Cargo.lock; geen eigen X.509-lijn.
[target.'cfg(not(windows))'.dependencies]
rustls-native-certs = "0.8"

# Win32_Security_Cryptography: het Windows-rootarchief en de gewantrouwde
# certificaten rechtstreeks en alleen-lezen lezen (handtekeningen), met de
# doelen en uitschakeldata per wortel.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
