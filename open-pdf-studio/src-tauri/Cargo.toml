[package]
name = "open-pdf-studio"
version = "2026.44.10"
description = "A free, open-source PDF annotation editor"
authors = ["OpenAEC Foundation"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenAEC-Foundation/Open-2D-Studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = ["devtools", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2"
dirs = "5"
# Windows-verbatimpaden (\\?\C:\...) terugzetten naar gewone paden voor
# C-bibliotheken die er zelf "/" achter plakken (Tesseract-taaldata).
# Staat al in Cargo.lock; geen nieuwe crate.
dunce = "1"
whoami = "1"
base64 = "0.22"
open = "5"
zip = "2"

tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# Reads a bitmap off the system clipboard for the screenshot-annotate feature
# (Windows PrtScn puts the capture on the clipboard). Cross-platform.
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }
open-pdf-render = { path = "../../open-pdf-render" }
# Export van een PDF-pagina naar DXF/DWG (#400); trekt acadrust mee (pure Rust,
# MPL-2.0). De app-crate bevat alleen de commando-schil in src/cad_export.rs.
open-pdf-cad = { path = "../../open-pdf-cad" }
# CMYK-omzetting voor de PDF/X-export (#422): Little CMS en de documentloop.
# De app-crate bevat alleen de commando-schil in src/pdfx_cmyk.rs.
open-pdf-cmyk = { path = "../../open-pdf-cmyk" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pdfium-render = { version = "0.9.4", features = ["thread_safe", "image_025"] }
# Ontsleutelen van PDF's met een wachtwoord (src/beveiligde_pdf.rs): een paar
# PDFium-functies die pdfium-render niet aanbiedt. Zelfde versie als pdfium-render.
libloading = "0.9"
clap = { version = "4", features = ["derive"] }

# OpenAEC Accounts ("Sign in with OpenAEC", accounts.rs): PKCE + OS-keyring
# token storage + multipart uploads to the Accounts API.
keyring = { version = "3", features = ["windows-native"] }
sha2 = { version = "0.10", features = ["oid"] }
# Digitale handtekeningen (#374): RustCrypto op de der 0.7-lijn. pkcs12 0.1,
# cms 0.2 en x509-cert 0.2 hangen daar zelf aan; niet mengen met der 0.8.
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "sha1-insecure"] }
cms = "0.2"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = "0.7"
x509-cert = "0.2"
const-oid = { version = "0.9", features = ["db"] }
hmac = "0.12"
sha1 = { version = "0.10", features = ["oid"] }
des = { version = "0.8", features = ["zeroize"] }
rc2 = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["alloc", "zeroize"] }
rsa = "0.9"
# ECDSA-verificatie (handtekeningen en certificaatketens, spec §7.1). 0.13 is de
# der 0.7-lijn; "pkcs8" levert ook Signature::from_der.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
zeroize = "1"
rand = "0.8"
aes = "0.8"
stringprep = "0.1"
unicode-normalization = "0.1"
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "process", "io-util", "time"] }
memmap2 = "0.9"
anyhow = "1"

# In-process MCP server for the render-regression-test harness. We hand-roll
# the JSON-RPC layer on top of axum rather than pulling in `rmcp`, because
# rmcp's macro-driven API has churned across versions and the harness only
# needs a small fixed method set (initialize / tools/list / tools/call).
axum = "0.8"

# Direct dep for MCP tool handlers that need to inspect PDF structure (page
# count, etc). Pinned to match `open-pdf-render`'s transitive version so the
# resolver picks a single lopdf in Cargo.lock.
lopdf = "0.34"
# Begrensd uitpakken van objectstromen bij het lezen van handtekeningen; zelfde
# versie als die lopdf al gebruikt.
flate2 = "1"

# OCR proof-of-concept (Traditional Chinese + English) — see js/... OCR plan.
#
# build-tesseract on every desktop platform: tesseract-rs compiles pinned
# Leptonica/Tesseract sources (versions in its build.rs) and links them
# STATICALLY into the binary, with image codecs, curl, libarchive, ICU and
# OpenMP disabled. The release binaries therefore need no libtesseract or
# libleptonica on the user's machine.
#
# Linux used to link the build machine's system Tesseract via
# use-system-tesseract (pkg-config). That baked the Ubuntu 22.04 soname
# libtesseract.so.4 into the binary as a NEEDED entry, so the raw binary and
# anything repackaged from the .deb failed to start on distributions that
# ship Tesseract 5 (libtesseract.so.5, e.g. Arch) or none at all (#620); the
# .deb never declared the dependency either. Static linking removes the
# dependency instead of chasing sonames. (The old worry that build-tesseract
# drags in native-tls/openssl-sys no longer holds: the pinned tesseract-rs
# uses reqwest 0.13 with rustls, and its use-system-tesseract feature already
# enabled build-tesseract, so reqwest was compiled on Linux regardless.)
# Building needs cmake and a C++ compiler; the first build downloads the
# sources and caches the static libs in ~/.tesseract-rs/<target>/.
#
# macOS builds both Apple targets from source for the universal binary; the
# [patch] of tesseract-rs in the workspace Cargo.toml namespaces that cache
# by target triple so the second architecture does not reuse the first one's
# libraries. Windows has no system-Tesseract story without vcpkg and builds
# cleanly from source.
#
# Android: no OCR. The source build of Tesseract/Leptonica does not work with
# the NDK (CMake misses CpuFeaturesNdkCompat, the link step misses
# -lleptonica), so the crate is left out entirely and `ocr_pdf_page` is a
# stub that returns an error (see src/lib.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
tesseract-rs = { version = "0.4", default-features = false, features = ["build-tesseract"] }

tauri-plugin-updater = "2"
# Drag-out window detach — desktop only (the crate has no mobile platform
# backend and fails to compile for Android/iOS).
tauri-plugin-drag = "2.1.1"
# Global system hotkey (PrtScn) for the opt-in screenshot-annotate feature.
# Desktop only.
tauri-plugin-global-shortcut = "2"

# Rootarchief van het besturingssysteem als DER buiten Windows (macOS-sleutelhanger,
# OpenSSL-paden op Linux). Staat al in Cargo.lock; geen eigen X.509-lijn.
[target.'cfg(not(windows))'.dependencies]
rustls-native-certs = "0.8"

# Win32_Security_Cryptography: het Windows-rootarchief en de gewantrouwde
# certificaten rechtstreeks en alleen-lezen lezen (handtekeningen), met de
# doelen en uitschakeldata per wortel.
# Win32_Security (met Win32_Graphics_Gdi): `PRINTER_INFO_2W`, voor de
# printerlijst uit de spooler (print_lijst.rs, #524).
# webview2-com + windows: de vensteropname van app_screenshot_view (#583) via
# ICoreWebView2::CapturePreview (src/webview_opname.rs). Dezelfde versies die
# wry en tauri al meebrengen; ze staan al in Cargo.lock.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys ={ version = "0.59", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading"] }

# De mock-runtime van Tauri, zodat een test een AppHandle kan maken zonder
# venster (logboek::registreer schrijft daarmee echt een logbestand). Alleen
# voor `cargo test`: met resolver 2 komt de feature niet in gewone builds.
[dev-dependencies]
tauri = { version = "2.10.2", features = ["test"] }
