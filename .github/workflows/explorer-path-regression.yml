name: Explorer path regression
on:
  pull_request:
    paths:
      - 'open-pdf-studio/src-tauri/src/verkenner_pad.rs'
      - '.github/workflows/explorer-path-regression.yml'
permissions:
  contents: read
jobs:
  explorer-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: open-pdf-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1' # 1.100 breaks tauri-build 2.6.2 (build-dir layout)
      - run: rustc --edition 2021 --test src-tauri/src/verkenner_pad.rs -o /tmp/verkenner-pad-tests && /tmp/verkenner-pad-tests
