name: Text rotation regression
on:
  pull_request:
    paths:
      - 'open-pdf-studio/js/tools/text-edit*'
      - 'open-pdf-studio/js/text/text-*'
      - 'open-pdf-studio/js/solid/stores/propertiesStore.js'
      - 'open-pdf-studio/js/solid/components/properties-panel/TextFormatSection.jsx'
      - 'open-pdf-studio/js/pdf/saver/text-edit*'
      - 'open-pdf-studio/scripts/test-add-text-rotation.mjs'
      - '.github/workflows/text-rotation-regression.yml'
permissions:
  contents: read
jobs:
  text-rotation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: open-pdf-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test js/text/text-rotation.test.mjs
      - run: node scripts/test-add-text-rotation.mjs
