name: Construction study fixtures
on:
  pull_request:
    paths:
      - 'fixtures/construction-study/**'
      - 'scripts/construction-study/**'
      - 'open-pdf-studio/public/pdfjs/web/standard_fonts/LiberationSans-Regular.ttf'
      - '.github/workflows/construction-study.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/construction-study/**'
      - 'scripts/construction-study/**'
      - 'open-pdf-studio/public/pdfjs/web/standard_fonts/LiberationSans-Regular.ttf'
      - '.github/workflows/construction-study.yml'
permissions:
  contents: read
jobs:
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/construction-study/requirements.txt
      - run: python -m unittest discover -s scripts/construction-study -p 'test_*.py' -v
