name: Rotation recovery regression
on:
  pull_request:
    paths:
      - 'open-pdf-studio/js/pdf/bitmap-orchestrator.js'
      - 'open-pdf-studio/js/pdf/page-bitmap-cache.js'
      - 'open-pdf-studio/js/pdf/progressive-render.js'
      - 'open-pdf-studio/scripts/test-rotation-recovery.mjs'
      - 'open-pdf-studio/js/pdf/saver.js'
      - 'open-pdf-studio/js/pdf/page-manager.js'
      - 'open-pdf-studio/js/pdf/saver/rotation-render-copy*'
      - 'open-pdf-studio/scripts/test-saved-page-rotation.mjs'
      - '.github/workflows/rotation-recovery-regression.yml'
permissions:
  contents: read
jobs:
  rotation-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: open-pdf-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-rotation-recovery.mjs
      - run: node scripts/test-saved-page-rotation.mjs
