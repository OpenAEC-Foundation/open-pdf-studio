# Puts the app and the relay on one origin.
#
# Everything the browser needs answers here: the page itself, POST /session to
# mint a code, WS /ws for the tab's connection, and POST /mcp/<code> for the
# agent. Because it is all one origin there is no CORS to get wrong and one
# certificate to renew.
#
# TLS is deliberately NOT configured here — terminate it in front (Caddy,
# Traefik, a cloud load balancer, or another nginx with certbot). See
# deploy/README.md.

upstream relay {
    server relay:9224;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded and generated PDFs travel through the relay as JSON-RPC bodies.
    client_max_body_size 32m;

    # ── The agent's endpoint ───────────────────────────────────────────────
    # A tool call blocks until the browser answers it. app_assistant_pending
    # is a long-poll by design and parks for up to ~10 minutes, so the read
    # timeout has to clear that or nginx kills a legitimate call.
    location /mcp/ {
        proxy_pass http://relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }

    # ── Session minting, called by the tab on load ─────────────────────────
    location = /session {
        proxy_pass http://relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Journal read-back (bearer-token protected by the relay) ────────────
    location /journal/ {
        proxy_pass http://relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://relay;
        access_log off;
    }

    # ── The browser tab's socket ───────────────────────────────────────────
    # Long-lived: the relay pings every 30s, so a 1h idle timeout is generous
    # without holding dead sockets forever.
    location = /ws {
        proxy_pass http://relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite fingerprints filenames, so hashed assets are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves tabs on the old
    # bundle pointing at hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing — mirrors public/_redirects for the static host.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
